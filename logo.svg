<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background is transparent so it fits the dark mode container -->
  <defs>
    <!-- Photonic Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8" />
    </linearGradient>
    
    <!-- Prism Core Gradient -->
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="1" />
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.2" />
    </linearGradient>

    <!-- Refraction Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- The Photonic Beam (Background intersection) -->
  <polygon points="50,350 350,50 360,60 60,360" fill="url(#beamGrad)" filter="url(#glow)"/>

  <!-- The Geometric Prism (Main Triangle) -->
  <polygon points="200,80 320,280 80,280" fill="none" stroke="url(#prismGrad)" stroke-width="12" stroke-linejoin="miter"/>
  
  <!-- Inner geometric sub-structure -->
  <polygon points="200,140 270,250 130,250" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.5"/>
  <line x1="200" y1="80" x2="200" y2="140" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.5"/>
  <line x1="80" y1="280" x2="130" y2="250" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.5"/>
  <line x1="320" y1="280" x2="270" y2="250" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Core Node / Intersection Point -->
  <circle cx="200" cy="200" r="8" fill="#D4AF37" filter="url(#glow)"/>
</svg>
