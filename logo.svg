<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <!-- Rich Chroma Gold metallic gradients -->
    <linearGradient id="goldTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2BD"/>
      <stop offset="45%" stop-color="#DFBC61"/>
      <stop offset="100%" stop-color="#8C6F2A"/>
    </linearGradient>
    <linearGradient id="goldTopRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE79A"/>
      <stop offset="60%" stop-color="#DFBC61"/>
      <stop offset="100%" stop-color="#6F561D"/>
    </linearGradient>
    <linearGradient id="goldCenter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#DFBC61"/>
      <stop offset="100%" stop-color="#554112"/>
    </linearGradient>
    <linearGradient id="goldLowerL" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E5C167"/>
      <stop offset="100%" stop-color="#9E7E2E"/>
    </linearGradient>
    <linearGradient id="goldLowerR" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#DFBC61"/>
      <stop offset="100%" stop-color="#7A5E1B"/>
    </linearGradient>
    <linearGradient id="prismaticEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Subtle drop shadow -->
    <filter id="glyphGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#DFBC61" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Crystal Mark (Scale 0.72, translated) -->
  <g transform="translate(12, 6) scale(0.68)" filter="url(#glyphGlow)">
    <!-- Top Left Wing -->
    <polygon points="56,2 10,78 52,44" fill="url(#goldTopLeft)"/>
    <!-- Top Right Wing -->
    <polygon points="58,2 104,78 62,44" fill="url(#goldTopRight)"/>
    <!-- Central Inward Notch / Center facet -->
    <polygon points="56,2 52,44 57,60 62,44 58,2" fill="url(#goldCenter)"/>
    <!-- Lower Diamond Center Facet -->
    <polygon points="57,60 32,84 57,112 82,84" fill="url(#goldTopLeft)"/>
    <!-- Lower Left Facet -->
    <polygon points="10,78 32,84 57,112 18,102" fill="url(#goldLowerL)"/>
    <!-- Lower Right Facet -->
    <polygon points="104,78 82,84 57,112 96,102" fill="url(#goldLowerR)"/>
    <!-- Prismatic edge highlights on facet seams -->
    <line x1="56" y1="2" x2="57" y2="60" stroke="url(#prismaticEdge)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="57" y1="60" x2="57" y2="112" stroke="#FFF2BD" stroke-width="1.0" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(100, 56)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="4">CHROMA</text>
    <text x="180" y="0" font-family="'Inter', sans-serif" font-weight="400" font-size="28" fill="#DFBC61" letter-spacing="4">LABS</text>
  </g>
</svg>
