<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer Triangle -->
  <polygon points="50,10 90,85 10,85" />
  <!-- Inner Triangle inverted -->
  <polygon points="30,47.5 70,47.5 50,85" />
  <!-- Core Tetrahedron -->
  <polygon points="50,25 65,55 35,55" />
  <line x1="50" y1="85" x2="50" y2="55" />
  <!-- Connecting nodes to imply structural geometry -->
  <line x1="50" y1="10" x2="50" y2="25" />
  <line x1="10" y1="85" x2="35" y2="55" />
  <line x1="90" y1="85" x2="65" y2="55" />
  <circle cx="50" cy="55" r="2" fill="#D4AF37"/>
</svg>